name: Whole-Wasm native and browser parity

on:
  pull_request:
    branches: [main, testing]
    paths:
      - '.github/workflows/whole-wasm-native-browser-parity.yml'
      - 'core/rust/Cargo.toml'
      - 'core/rust/Cargo.lock'
      - 'core/rust/assets/whole-wasm-native-browser-parity.hal'
      - 'core/rust/assets/whole-wasm-workloads.json'
      - 'core/rust/src/bin/hara-whole-wasm-benchmark.rs'
      - 'core/rust/src/bin/hara-whole-wasm-artifact.rs'
      - 'core/rust/src/compiled_product.rs'
      - 'core/rust/src/core.rs'
      - 'core/rust/src/lib.rs'
      - 'core/rust/src/numeric.rs'
      - 'core/rust/src/runtime/model.rs'
      - 'core/rust/src/runtime/bytecode.rs'
      - 'core/rust/src/runtime/runtime.rs'
      - 'core/rust/src/instrumentation.rs'
      - 'core/rust/src/instrumentation/conformance.rs'
      - 'core/spec/instrumentation-conformance.json'
      - 'core/rust/src/vm/**'
      - 'core/rust/tests/whole_wasm_native.rs'
      - 'core/rust/src/whole_wasm.rs'
      - 'core/rust/src/whole_wasm/**'
      - 'core/rust/web/package.json'
      - 'core/rust/web/package-lock.json'
      - 'core/rust/web/playwright.config.js'
      - 'core/rust/web/whole-wasm-browser.spec.js'
      - 'core/rust/web/packages/browser/src/index.js'
      - 'core/rust/web/packages/browser/src/whole-wasm.js'
      - 'core/rust/web/packages/browser/vite.config.js'
      - 'scripts/runtime/build-hara-browser'
      - 'scripts/runtime/cargo-wasm-build'
  push:
    branches: [main, testing]
    paths:
      - '.github/workflows/whole-wasm-native-browser-parity.yml'
      - 'core/rust/Cargo.toml'
      - 'core/rust/Cargo.lock'
      - 'core/rust/assets/whole-wasm-native-browser-parity.hal'
      - 'core/rust/assets/whole-wasm-workloads.json'
      - 'core/rust/src/bin/hara-whole-wasm-benchmark.rs'
      - 'core/rust/src/bin/hara-whole-wasm-artifact.rs'
      - 'core/rust/src/compiled_product.rs'
      - 'core/rust/src/core.rs'
      - 'core/rust/src/lib.rs'
      - 'core/rust/src/numeric.rs'
      - 'core/rust/src/runtime/model.rs'
      - 'core/rust/src/runtime/bytecode.rs'
      - 'core/rust/src/runtime/runtime.rs'
      - 'core/rust/src/instrumentation.rs'
      - 'core/rust/src/instrumentation/conformance.rs'
      - 'core/spec/instrumentation-conformance.json'
      - 'core/rust/src/vm/**'
      - 'core/rust/tests/whole_wasm_native.rs'
      - 'core/rust/src/whole_wasm.rs'
      - 'core/rust/src/whole_wasm/**'
      - 'core/rust/web/package.json'
      - 'core/rust/web/package-lock.json'
      - 'core/rust/web/playwright.config.js'
      - 'core/rust/web/whole-wasm-browser.spec.js'
      - 'core/rust/web/packages/browser/src/index.js'
      - 'core/rust/web/packages/browser/src/whole-wasm.js'
      - 'core/rust/web/packages/browser/vite.config.js'
      - 'scripts/runtime/build-hara-browser'
      - 'scripts/runtime/cargo-wasm-build'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whole-wasm-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-artifact:
    name: Compile and execute HNW0 with Wasmtime
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run the native whole-Wasm suite
        run: >-
          cargo test --locked
          --manifest-path core/rust/Cargo.toml
          --features whole-wasm
          --test whole_wasm_native

      - name: Record native five-workload parity and timing evidence
        run: |
          mkdir -p core/target
          cargo run --quiet --locked \
            --manifest-path core/rust/Cargo.toml \
            --features whole-wasm \
            --bin hara-whole-wasm-benchmark -- \
            core/target/whole-wasm-native-performance.json

      - name: Compile the parity fixture twice
        run: |
          mkdir -p core/target
          cargo run --quiet --locked \
            --manifest-path core/rust/Cargo.toml \
            --features whole-wasm \
            --bin hara-whole-wasm-artifact -- \
            compile \
            core/rust/assets/whole-wasm-native-browser-parity.hal \
            core/target/whole-wasm-native-browser-parity.first.hnw
          cargo run --quiet --locked \
            --manifest-path core/rust/Cargo.toml \
            --features whole-wasm \
            --bin hara-whole-wasm-artifact -- \
            compile \
            core/rust/assets/whole-wasm-native-browser-parity.hal \
            core/target/whole-wasm-native-browser-parity.hnw
          cmp \
            core/target/whole-wasm-native-browser-parity.first.hnw \
            core/target/whole-wasm-native-browser-parity.hnw
          rm core/target/whole-wasm-native-browser-parity.first.hnw

      - name: Execute the exact artifact with Wasmtime
        run: |
          result="$(cargo run --quiet --locked \
            --manifest-path core/rust/Cargo.toml \
            --features whole-wasm \
            --bin hara-whole-wasm-artifact -- \
            run core/target/whole-wasm-native-browser-parity.hnw)"
          test "$result" = "12497500"
          sha256sum core/target/whole-wasm-native-browser-parity.hnw \
            > core/target/whole-wasm-native-browser-parity.sha256
          cat core/target/whole-wasm-native-browser-parity.sha256

      - name: Upload the native-verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: whole-wasm-native-browser-parity
          path: |
            core/target/whole-wasm-native-browser-parity.hnw
            core/target/whole-wasm-native-browser-parity.sha256
            core/target/whole-wasm-native-performance.json
          if-no-files-found: error

  browser-artifact:
    name: Execute the same HNW0 bytes with Chromium
    needs: native-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Download the native-verified artifact
        uses: actions/download-artifact@v4
        with:
          name: whole-wasm-native-browser-parity
          path: core/target

      - name: Verify the downloaded artifact
        run: sha256sum -c core/target/whole-wasm-native-browser-parity.sha256

      - name: Set up Rust Wasm toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install the matching wasm-bindgen CLI
        shell: bash
        run: |
          version="$(
            cargo metadata --locked \
              --manifest-path core/rust/Cargo.toml \
              --format-version 1 \
            | python3 -c '
          import json, sys
          metadata = json.load(sys.stdin)
          versions = sorted({package["version"] for package in metadata["packages"] if package["name"] == "wasm-bindgen"})
          if len(versions) != 1:
              raise SystemExit(f"expected one wasm-bindgen version, got {versions}")
          print(versions[0])
          '
          )"
          echo "wasm-bindgen-cli=$version"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/rust/web/package-lock.json

      - name: Install browser dependencies
        working-directory: core/rust/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the full browser runtime
        run: ./scripts/runtime/build-hara-browser full

      - name: Execute whole-Wasm browser parity tests
        working-directory: core/rust/web
        run: npx playwright test whole-wasm-browser.spec.js --reporter=line

      - name: Upload browser five-workload timing evidence
        uses: actions/upload-artifact@v4
        with:
          name: whole-wasm-browser-performance
          path: core/target/whole-wasm-browser-performance.json
          if-no-files-found: error
