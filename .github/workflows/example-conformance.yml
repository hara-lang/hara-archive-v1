name: Example conformance

on:
  pull_request:
    paths:
      - "core/lib/examples/**"
      - "GETTING_STARTED.md"
      - "scripts/check_examples_catalog.py"
      - "scripts/run_examples_catalog.py"
      - ".github/workflows/example-conformance.yml"
  push:
    branches: [main]
    paths:
      - "core/lib/examples/**"
      - "GETTING_STARTED.md"
      - "scripts/check_examples_catalog.py"
      - "scripts/run_examples_catalog.py"
      - ".github/workflows/example-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate closed example inventory and authority
        run: python scripts/check_examples_catalog.py
      - name: Test catalog validator
        run: python scripts/test_check_examples_catalog.py

  native-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build hara-lite evaluator
        run: cargo build --manifest-path core/rust/Cargo.toml --no-default-features --features direct-native --bin hara-lite
      - name: Validate deterministic catalog (first run)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_examples_catalog.py \
            --native "$PWD/core/rust/target/debug/hara-lite" \
            --runtime rust
      - name: Validate deterministic catalog (repeat run)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_examples_catalog.py \
            --native "$PWD/core/rust/target/debug/hara-lite" \
            --runtime rust
