name: code.vm and LiveSession instrumentation validation

run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('code.vm instrumentation · {0} · {1}', github.event.client_payload.ref, github.event.client_payload.request_id)
      || format('code.vm instrumentation · {0}', github.ref_name) }}

on:
  pull_request:
    branches:
      - main
      - testing
      - 'instrumentation-*'
    paths:
      - 'core/lib/src/code/vm.hal'
      - 'core/lib/src/code/vm/instrument/**'
      - 'core/lib/test/code/vm/instrument/**'
      - 'core/rust/src/runtime/session_live.rs'
      - 'core/rust/src/live_session.rs'
      - 'core/rust/src/live_session/instrumented_interpreter.rs'
      - 'core/rust/src/live_session/instrumented_hbc.rs'
      - 'core/rust/src/instrumentation.rs'
      - 'core/rust/src/instrumentation/conformance.rs'
      - 'core/rust/src/runtime/model.rs'
      - 'core/rust/tests/sandbox_private_live_session.rs'
      - 'core/rust/standard-library.namespaces'
      - 'core/spec/instrumentation-conformance.json'
      - 'core/rust/src/bin/hara-instrumentation-conformance.rs'
      - 'core/rust/src/bin/hara-instrumentation-compare.rs'
      - 'core/java/src/main/java/hara/truffle/InstrumentationConformance.java'
      - 'core/java/src/main/java/hara/truffle/CodeVmConformanceDocument.java'
      - 'core/rust/web/packages/browser/src/index.js'
      - 'core/rust/web/instrumentation-browser.spec.js'
      - 'core/rust/web/playwright.config.js'
      - '.github/workflows/instrumentation-code-vm.yml'
  push:
    branches: [main, testing]
    paths:
      - 'core/lib/src/code/vm.hal'
      - 'core/lib/src/code/vm/instrument/**'
      - 'core/lib/test/code/vm/instrument/**'
      - 'core/rust/src/runtime/session_live.rs'
      - 'core/rust/src/live_session.rs'
      - 'core/rust/src/live_session/instrumented_interpreter.rs'
      - 'core/rust/src/live_session/instrumented_hbc.rs'
      - 'core/rust/src/instrumentation.rs'
      - 'core/rust/src/instrumentation/conformance.rs'
      - 'core/rust/src/runtime/model.rs'
      - 'core/rust/tests/sandbox_private_live_session.rs'
      - 'core/rust/standard-library.namespaces'
      - 'core/spec/instrumentation-conformance.json'
      - 'core/rust/src/bin/hara-instrumentation-conformance.rs'
      - 'core/rust/src/bin/hara-instrumentation-compare.rs'
      - 'core/java/src/main/java/hara/truffle/InstrumentationConformance.java'
      - 'core/java/src/main/java/hara/truffle/CodeVmConformanceDocument.java'
      - 'core/rust/web/packages/browser/src/index.js'
      - 'core/rust/web/instrumentation-browser.spec.js'
      - 'core/rust/web/playwright.config.js'
      - '.github/workflows/instrumentation-code-vm.yml'
  repository_dispatch:
    types: [hara-instrumentation-code-vm]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-vm-instrumentation-${{ github.event.client_payload.request_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref || github.ref }}

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check instrumented LiveSession formatting
        run: |
          rustfmt --edition 2021 --check \
            core/rust/src/runtime/session_live.rs \
            core/rust/src/live_session.rs \
            core/rust/src/live_session/instrumented_interpreter.rs \
            core/rust/src/live_session/instrumented_hbc.rs

      - name: Compile the Runtime-owned interpreter instrumentation path
        run: |
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            --package hara-runtime --lib --no-run

      - name: Compile the instrumented HBC observation feature slice
        run: |
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            --package hara-runtime --features bytecode-observation --lib --no-run

      - name: Test LiveSession model and adapters
        run: |
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            --package hara-runtime --lib live_session
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            --package hara-runtime --features bytecode-observation --lib live_session

      - name: Test private Session ownership and fencing
        run: |
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            --test sandbox_private_live_session
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            --features bytecode-observation \
            --test sandbox_private_live_session

      - name: Materialize generated HAL packaging inputs
        run: |
          python3 scripts/runtime/sync-rust-hal-src
          python3 scripts/runtime/sync-rust-hal-src --check
          grep -Fx 'code.vm.instrument.trace' core/rust/standard-library.namespaces

      - name: Run portable instrumentation contract tests
        run: ./scripts/runtime/run-lib-tests --backend interpreter core/lib/test/code/vm/instrument_test.hal

      - name: Run passive live trace conversion tests
        run: ./scripts/runtime/run-lib-tests --backend interpreter core/lib/test/code/vm/instrument/trace_test.hal

      - name: Reject control or runtime ownership from pure trace namespace
        run: |
          file=core/lib/src/code/vm/instrument/trace.hal
          if grep -nE 'InstrumentationHub|ControlLease|EvalFiber|Machine/|Promise|step_observed|run_observed|resume_observed' "$file"; then
            echo "code.vm.instrument.trace must remain a pure event-to-transition consumer" >&2
            exit 1
          fi

      - name: Enforce bounded child modules
        run: |
          test "$(wc -l < core/lib/src/code/vm/instrument/trace.hal)" -lt 700
          test "$(wc -l < core/rust/src/live_session/instrumented_interpreter.rs)" -lt 700
          test "$(wc -l < core/rust/src/live_session/instrumented_hbc.rs)" -lt 700

  cross_runtime:
    name: Cross-runtime instrumentation corpus and comparator
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref || github.ref }}

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Build the Java producer
        run: mvn -B -f core/java/pom.xml -Ptruffle -DskipTests compile

      - name: Resolve the Java producer runtime classpath
        run: |
          mvn -B -q -f core/java/pom.xml -Ptruffle \
            dependency:build-classpath \
            -Dmdep.outputFile=target/instrumentation-classpath.txt \
            -Dmdep.includeScope=runtime

      - name: Produce deterministic Rust and Java reports
        run: |
          mkdir -p core/target
          cargo run --locked --manifest-path core/rust/Cargo.toml \
            --bin hara-instrumentation-conformance -- \
            --corpus core/spec/instrumentation-conformance.json \
            --output core/target/instrumentation-rust-a.json
          cargo run --locked --manifest-path core/rust/Cargo.toml \
            --bin hara-instrumentation-conformance -- \
            --corpus core/spec/instrumentation-conformance.json \
            --output core/target/instrumentation-rust-b.json
          cmp core/target/instrumentation-rust-a.json core/target/instrumentation-rust-b.json
          java -cp "core/java/target/classes:$(cat core/java/target/instrumentation-classpath.txt)" \
            -Dhara.instrumentationReport=core/target/instrumentation-java-a.json \
            hara.truffle.InstrumentationConformance \
            --corpus core/spec/instrumentation-conformance.json
          java -cp "core/java/target/classes:$(cat core/java/target/instrumentation-classpath.txt)" \
            -Dhara.instrumentationReport=core/target/instrumentation-java-b.json \
            hara.truffle.InstrumentationConformance \
            --corpus core/spec/instrumentation-conformance.json
          cmp core/target/instrumentation-java-a.json core/target/instrumentation-java-b.json

      - name: Compare Rust and Java reports
        run: |
          cargo run --locked --manifest-path core/rust/Cargo.toml \
            --bin hara-instrumentation-compare -- \
            core/target/instrumentation-rust-a.json \
            core/target/instrumentation-java-a.json

      - name: Upload cross-runtime conformance evidence
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-cross-runtime-conformance
          path: |
            core/spec/instrumentation-conformance.json
            core/target/instrumentation-rust-a.json
            core/target/instrumentation-java-a.json

      - name: Check cross-runtime patch whitespace
        run: git diff --check

  browser:
    name: Compare the browser/Wasm instrumentation producer
    needs: cross_runtime
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Download native and Java reports
        uses: actions/download-artifact@v4
        with:
          name: instrumentation-cross-runtime-conformance
          path: core

      - name: Verify browser instrumentation inputs
        run: |
          test -s core/spec/instrumentation-conformance.json
          test -s core/target/instrumentation-rust-a.json
          test -s core/target/instrumentation-java-a.json

      - name: Set up Rust Wasm toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install the matching wasm-bindgen CLI
        shell: bash
        run: |
          version="$(
            cargo metadata --locked \
              --manifest-path core/rust/Cargo.toml \
              --format-version 1 \
            | python3 -c '
          import json, sys
          metadata = json.load(sys.stdin)
          versions = sorted({package["version"] for package in metadata["packages"] if package["name"] == "wasm-bindgen"})
          if len(versions) != 1:
              raise SystemExit(f"expected one wasm-bindgen version, got {versions}")
          print(versions[0])
          '
          )"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/rust/web/package-lock.json

      - name: Install browser dependencies
        working-directory: core/rust/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the full browser runtime
        run: ./scripts/runtime/build-hara-browser full

      - name: Compare browser/Wasm instrumentation evidence
        working-directory: core/rust/web
        run: npx playwright test instrumentation-browser.spec.js --reporter=line

  report-connector-event:
    if: ${{ always() && github.event_name == 'repository_dispatch' }}
    needs: [focused, cross_runtime, browser]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report connector event completion
        uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.focused.result == 'success' && needs.cross_runtime.result == 'success' && needs.browser.result == 'success' && 'success' || (needs.focused.result == 'cancelled' || needs.cross_runtime.result == 'cancelled' || needs.browser.result == 'cancelled') && 'cancelled' || 'failure' }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          EVENT: ${{ github.event.client_payload.event }}
          REF: ${{ github.event.client_payload.ref }}
          ACTOR: ${{ github.event.client_payload.actor }}
          SOURCE_URL: ${{ github.event.client_payload.source_url }}
          WORKFLOW: instrumentation-code-vm.yml
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || 0);
            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
              core.notice('No issue was supplied for connector completion reporting.');
              return;
            }
            const clean = (value, limit = 200) => String(value || '')
              .replace(/[\r\n`]/g, '')
              .slice(0, limit);
            const requestId = clean(process.env.REQUEST_ID);
            const event = clean(process.env.EVENT);
            if (!requestId || !event) {
              core.warning('Connector completion payload is missing request identity.');
              return;
            }
            const result = clean(process.env.RESULT || 'unknown', 40);
            const ref = clean(process.env.REF);
            const actor = clean(process.env.ACTOR);
            const workflow = clean(process.env.WORKFLOW);
            const sourceUrl = String(process.env.SOURCE_URL || '').startsWith('https://github.com/')
              ? process.env.SOURCE_URL
              : '';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const marker = `<!-- hara-connector-completion:${requestId}:${event} -->`;
            const icon = result === 'success' ? '✅' : result === 'cancelled' ? '⚪' : '❌';
            const lines = [
              marker,
              `### ${icon} Connector event completed`,
              '',
              `- Event: \`${event}\``,
              `- Ref: \`${ref}\``,
              `- Workflow: \`${workflow}\``,
              `- Result: **${result}**`,
              `- Actor: \`${actor}\``,
              `- Run: ${runUrl}`,
            ];
            if (sourceUrl) lines.push(`- Source request: ${sourceUrl}`);
            const body = lines.join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body,
              });
            }
