name: Native, protocol, and Foundation behavioral conformance in browser Wasm

on:
  pull_request:
    branches: [main, testing]
    paths:
      - '.github/workflows/native-behavioral-conformance-browser.yml'
      - 'core/lib/src/std/foundation.hal'
      - 'core/lib/src/std/foundation/**'
      - 'core/rust/Cargo.toml'
      - 'core/rust/Cargo.lock'
      - 'core/rust/src/**'
      - 'core/rust/web/native-behavioral-conformance.spec.js'
      - 'core/rust/web/foundation-behavioral-conformance.spec.js'
      - 'core/rust/web/protocol-behavioral-conformance.spec.js'
      - 'core/rust/web/conformance-bootstrap.js'
      - 'core/rust/web/playground.js'
      - 'core/rust/web/playground-browser.spec.js'
      - 'core/rust/web/package.json'
      - 'core/rust/web/package-lock.json'
      - 'core/rust/web/playwright.config.js'
      - 'core/rust/web/packages/browser/**'
      - 'scripts/runtime/build-hara-browser'
      - 'scripts/runtime/cargo-wasm-build'
  push:
    branches: [main, testing]
    paths:
      - '.github/workflows/native-behavioral-conformance-browser.yml'
      - 'core/lib/src/std/foundation.hal'
      - 'core/lib/src/std/foundation/**'
      - 'core/rust/Cargo.toml'
      - 'core/rust/Cargo.lock'
      - 'core/rust/src/**'
      - 'core/rust/web/native-behavioral-conformance.spec.js'
      - 'core/rust/web/foundation-behavioral-conformance.spec.js'
      - 'core/rust/web/protocol-behavioral-conformance.spec.js'
      - 'core/rust/web/conformance-bootstrap.js'
      - 'core/rust/web/playground.js'
      - 'core/rust/web/playground-browser.spec.js'
      - 'core/rust/web/package.json'
      - 'core/rust/web/package-lock.json'
      - 'core/rust/web/playwright.config.js'
      - 'core/rust/web/packages/browser/**'
      - 'scripts/runtime/build-hara-browser'
      - 'scripts/runtime/cargo-wasm-build'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-behavior-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Run shared native, protocol, and Foundation corpora in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust Wasm toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install the matching wasm-bindgen CLI
        shell: bash
        run: |
          version="$(
            cargo metadata --locked \
              --manifest-path core/rust/Cargo.toml \
              --format-version 1 \
            | python3 -c '
          import json, sys
          metadata = json.load(sys.stdin)
          versions = sorted({package["version"] for package in metadata["packages"] if package["name"] == "wasm-bindgen"})
          if len(versions) != 1:
              raise SystemExit(f"expected one wasm-bindgen version, got {versions}")
          print(versions[0])
          '
          )"
          echo "wasm-bindgen-cli=$version"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/rust/web/package-lock.json

      - name: Install browser dependencies
        working-directory: core/rust/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the full browser runtime
        run: ./scripts/runtime/build-hara-browser full

      - name: Execute native, protocol, and Foundation behavioral conformance
        working-directory: core/rust/web
        run: >-
          npx playwright test
          native-behavioral-conformance.spec.js
          foundation-behavioral-conformance.spec.js
          protocol-behavioral-conformance.spec.js
          --reporter=line
