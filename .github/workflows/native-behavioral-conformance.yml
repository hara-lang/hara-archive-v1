name: Native behavioral conformance

on:
  pull_request:
    branches: [main, testing]
    paths:
      - '.github/workflows/native-behavioral-conformance.yml'
      - 'core/lib/test-fixtures/std/foundation/native_method_conformance.hal'
      - 'core/lib/src/std/foundation.hal'
      - 'core/lib/src/std/foundation/**'
      - 'core/rust/Cargo.toml'
      - 'core/rust/Cargo.lock'
      - 'core/rust/build.rs'
      - 'core/rust/bootstrap.namespaces'
      - 'core/rust/src/**'
      - 'core/java/**'
  push:
    branches: [main, testing]
    paths:
      - '.github/workflows/native-behavioral-conformance.yml'
      - 'core/lib/test-fixtures/std/foundation/native_method_conformance.hal'
      - 'core/lib/src/std/foundation.hal'
      - 'core/lib/src/std/foundation/**'
      - 'core/rust/Cargo.toml'
      - 'core/rust/Cargo.lock'
      - 'core/rust/build.rs'
      - 'core/rust/bootstrap.namespaces'
      - 'core/rust/src/**'
      - 'core/java/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-behavior-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust evaluator and bytecode corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run the source-owned native corpus
        run: >-
          cargo test --locked
          --manifest-path core/rust/Cargo.toml
          native_behavioral_conformance_tests::
          --lib -- --nocapture

  truffle:
    name: Truffle source-owned corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Run the source-owned native corpus
        working-directory: core
        run: >-
          mvn -B -Ptruffle,conformance
          -Dtest=NativeBehavioralConformanceTest
          test --file java/pom.xml
