name: Trusted native instrumentation validation

run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('Trusted native instrumentation · {0} · {1}', github.event.client_payload.ref, github.event.client_payload.request_id)
      || format('Trusted native instrumentation · {0}', github.ref_name) }}

on:
  pull_request:
    branches:
      - main
      - testing
      - 'instrumentation-*'
    paths:
      - 'core/rust/src/instrumentation.rs'
      - 'core/rust/src/instrumentation/native.rs'
      - 'core/rust/src/instrumentation/native/**'
      - 'core/rust/src/instrumentation/native_identity.rs'
      - 'core/rust/src/instrumentation/native_identity/**'
      - 'core/rust/src/runtime/session_instrumentation.rs'
      - 'core/rust/tests/native_instrumentation_minimal.rs'
      - 'core/rust/src/lib.rs'
      - '.github/workflows/instrumentation-native.yml'
  push:
    branches: [main, testing]
    paths:
      - 'core/rust/src/instrumentation.rs'
      - 'core/rust/src/instrumentation/native.rs'
      - 'core/rust/src/instrumentation/native/**'
      - 'core/rust/src/instrumentation/native_identity.rs'
      - 'core/rust/src/instrumentation/native_identity/**'
      - 'core/rust/src/runtime/session_instrumentation.rs'
      - 'core/rust/tests/native_instrumentation_minimal.rs'
      - 'core/rust/src/lib.rs'
      - '.github/workflows/instrumentation-native.yml'
  repository_dispatch:
    types: [hara-instrumentation-native]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-native-instrumentation-${{ github.event.client_payload.request_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref || github.ref }}

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check trusted native instrumentation formatting
        run: |
          rustfmt --edition 2021 --config skip_children=true --check \
            core/rust/src/instrumentation.rs \
            core/rust/src/instrumentation/native.rs \
            core/rust/src/instrumentation/native/tests.rs \
            core/rust/src/instrumentation/native_identity.rs \
            core/rust/src/instrumentation/native_identity/tests.rs \
            core/rust/src/instrumentation/native_identity/whole_wasm_tests.rs \
            core/rust/src/runtime/session_instrumentation.rs

      - name: Test trusted native service with the production feature set
        run: |
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            --package hara-runtime --lib trusted_native_

      - name: Exercise trusted native attachment over instrumented HBC
        run: |
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            --package hara-runtime --features bytecode-observation --lib \
            trusted_native_binds_and_observes_real_hbc_live_target

      - name: Test trusted native service without optional bytecode features
        run: |
          cargo check --locked --manifest-path core/rust/Cargo.toml \
            --no-default-features --lib
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            --no-default-features --test native_instrumentation_minimal

      - name: Preserve shared hub and private Session behavior
        run: |
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            --package hara-runtime --lib instrumentation::tests
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            --test sandbox_private_live_session

      - name: Reject ambient, guest, portable, and deferred authority
        run: |
          ambient_pattern='Instrumentation/current|std\.native\.Instrumentation/current|(^|[^[:alnum:]_])instrumentation_current[[:space:]]*\('
          if printf '%s\n' 'fn instrumentation_current_frame(' | grep -Eq "$ambient_pattern"; then
            echo 'Ambient lookup guard rejects scoped frame helpers' >&2
            exit 1
          fi
          if ! printf '%s\n' 'fn instrumentation_current(' | grep -Eq "$ambient_pattern"; then
            echo 'Ambient lookup guard no longer rejects the forbidden API' >&2
            exit 1
          fi
          if grep -R -nE "$ambient_pattern" core/rust/src core/lib/src; then
            echo 'Instrumentation must not have an ambient current lookup' >&2
            exit 1
          fi
          if grep -Fx 'std.native.Instrumentation' core/rust/standard-library.namespaces; then
            echo 'Native Instrumentation must not enter the Hara library inventory' >&2
            exit 1
          fi
          if grep -nE \
            'core::Value|serde|wasm_bindgen|hta::|hbc::|json::' \
            core/rust/src/instrumentation/native.rs \
            core/rust/src/instrumentation/native_identity.rs \
            core/rust/src/runtime/session_instrumentation.rs; then
            echo 'Native Instrumentation must remain outside portable value/codec surfaces' >&2
            exit 1
          fi
          if grep -nE 'TransformHalc|TransformHbc|RetransformHalc|RetransformHbc' \
            core/rust/src/instrumentation/native.rs \
            core/rust/src/instrumentation/native_identity.rs; then
            echo 'Artifact transformation remains deferred to tranche 6' >&2
            exit 1
          fi

      - name: Enforce bounded native surface modules
        run: |
          test "$(wc -l < core/rust/src/instrumentation/native.rs)" -lt 700
          test "$(wc -l < core/rust/src/instrumentation/native/tests.rs)" -lt 700
          test "$(wc -l < core/rust/src/instrumentation/native_identity.rs)" -lt 100
          test "$(wc -l < core/rust/src/instrumentation/native_identity/tests.rs)" -lt 350
          test "$(wc -l < core/rust/src/runtime/session_instrumentation.rs)" -lt 200

      - name: Check patch whitespace
        run: git diff --check

  report-connector-event:
    if: ${{ always() && github.event_name == 'repository_dispatch' }}
    needs: focused
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report connector event completion
        uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.focused.result }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          EVENT: ${{ github.event.client_payload.event }}
          REF: ${{ github.event.client_payload.ref }}
          ACTOR: ${{ github.event.client_payload.actor }}
          SOURCE_URL: ${{ github.event.client_payload.source_url }}
          WORKFLOW: instrumentation-native.yml
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || 0);
            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
              core.notice('No issue was supplied for connector completion reporting.');
              return;
            }
            const clean = (value, limit = 200) => String(value || '')
              .replace(/[\r\n`]/g, '')
              .slice(0, limit);
            const requestId = clean(process.env.REQUEST_ID);
            const event = clean(process.env.EVENT);
            if (!requestId || !event) {
              core.warning('Connector completion payload is missing request identity.');
              return;
            }
            const result = clean(process.env.RESULT || 'unknown', 40);
            const ref = clean(process.env.REF);
            const actor = clean(process.env.ACTOR);
            const workflow = clean(process.env.WORKFLOW);
            const sourceUrl = String(process.env.SOURCE_URL || '').startsWith('https://github.com/')
              ? process.env.SOURCE_URL
              : '';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const marker = `<!-- hara-connector-completion:${requestId}:${event} -->`;
            const icon = result === 'success' ? '✅' : result === 'cancelled' ? '⚪' : '❌';
            const lines = [
              marker,
              `### ${icon} Connector event completed`,
              '',
              `- Event: \`${event}\``,
              `- Ref: \`${ref}\``,
              `- Workflow: \`${workflow}\``,
              `- Result: **${result}**`,
              `- Actor: \`${actor}\``,
              `- Run: ${runUrl}`,
            ];
            if (sourceUrl) lines.push(`- Source request: ${sourceUrl}`);
            const body = lines.join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body,
              });
            }
