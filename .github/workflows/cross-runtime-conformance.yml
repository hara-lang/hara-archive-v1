name: Rust-Java conformance ladder

on:
  pull_request:
    branches: [main, testing]
    paths:
      - '.github/workflows/cross-runtime-conformance.yml'
      - 'Makefile'
      - 'core/java/**'
      - 'core/lib/**'
      - 'core/rust/**'
  push:
    branches: [main, testing]
    paths:
      - '.github/workflows/cross-runtime-conformance.yml'
      - 'Makefile'
      - 'core/java/**'
      - 'core/lib/**'
      - 'core/rust/**'
  workflow_dispatch:
    inputs:
      specs_ref:
        description: Exact hara-specs-registry branch, tag, or commit to test
        required: false
        default: f0c9f72c6c22ef7b9a3df4f996dc35e72e35fe44

permissions:
  contents: read

concurrency:
  group: cross-runtime-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_SPECS_REF: f0c9f72c6c22ef7b9a3df4f996dc35e72e35fe44
  HARA_SPECS_REGISTRY: ${{ github.workspace }}/hara-specs-registry

jobs:
  interfaces:
    name: Interfaces (Rust evaluator and Java Truffle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check out the exact specs revision
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          ref: ${{ inputs.specs_ref || env.DEFAULT_SPECS_REF }}
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Run Rust-Java protocol declaration parity
        run: make test-rust-java-parity-interfaces

  native:
    name: std.native (Rust evaluator and Java Truffle)
    needs: interfaces
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check out the exact specs revision
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          ref: ${{ inputs.specs_ref || env.DEFAULT_SPECS_REF }}
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Run Rust-Java native inventory and behavior parity
        run: make test-rust-java-parity-native

  halc:
    name: HALC (Rust evaluator and Java Truffle)
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check out the exact specs revision
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          ref: ${{ inputs.specs_ref || env.DEFAULT_SPECS_REF }}
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Run Rust-Java HALC artifact parity
        run: make test-rust-java-parity-halc

  hta:
    name: HTA portable wire (Rust and Java)
    needs: halc
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check out the exact specs revision
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          ref: ${{ inputs.specs_ref || env.DEFAULT_SPECS_REF }}
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Run Rust-Java HTA portable-wire parity
        run: make test-rust-java-parity-hta
