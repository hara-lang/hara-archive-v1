name: std.db Graph Compiler

on:
  pull_request:
    branches: [main, testing]
    paths:
      - "core/lib/src/db/text/base_scope.hal"
      - "core/lib/src/db/text/base_graph.hal"
      - "core/lib/src/db/text/sql_graph.hal"
      - "core/lib/src/db/text/base_tree.hal"
      - "core/lib/src/db/text/sql_tree.hal"
      - "core/lib/src/db/text/sql_view.hal"
      - "core/lib/src/db/text/sql_call.hal"
      - "core/lib/src/db/text/sql_util.hal"
      - "core/lib/src/db/text/base_check.hal"
      - "core/lib/test/db/text/base_scope_test.hal"
      - "core/lib/test/db/text/base_graph_test.hal"
      - "core/lib/test/db/text/sql_graph_test.hal"
      - "core/lib/test/db/text/base_tree_test.hal"
      - "core/lib/test/db/text/sql_tree_test.hal"
      - "core/lib/test/db/text/sql_view_test.hal"
      - "core/lib/test/db/text/sql_call_test.hal"
      - "core/java/src/test/java/hara/truffle/HaraDbGraphTest.java"
      - ".github/workflows/std-db-graph.yml"
  workflow_dispatch:

concurrency:
  group: std-db-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Execute graph compiler fixtures through Hara
        run: mvn -B -f core/java/pom.xml -Ptruffle -DfailIfNoTests=true -Dtest=hara.truffle.HaraDbGraphTest test
