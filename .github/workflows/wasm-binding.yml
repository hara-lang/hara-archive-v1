name: Wasm binding contract

on:
  pull_request:
    branches: [main, testing]
    paths:
      - 'core/java/pom.xml'
      - 'core/java/src/main/java/hara/truffle/HaraExtensionManifest.java'
      - 'core/java/src/main/java/hara/truffle/HaraExtensionPackage.java'
      - 'core/java/src/main/java/hara/truffle/HaraWasmExtension.java'
      - 'core/java/src/main/java/hara/truffle/HaraWasmMemory*.java'
      - 'core/java/src/test/java/hara/truffle/HaraExtensionManifestTest.java'
      - 'core/java/src/test/java/hara/truffle/HaraWasmMemoryBindingTest.java'
      - 'core/lib/src/tool/cli/extension.hal'
      - 'core/lib/src/tool/cli/handlers.hal'
      - 'core/lib/test/tool/cli/extension_test.hal'
      - 'core/lib/test/tool/cli/handlers_test.hal'
      - 'core/rust/Cargo.toml'
      - 'core/rust/Cargo.lock'
      - 'core/rust/resources/hara-cli-extension-*.edn'
      - 'core/rust/src/bin/hara/cli/hara.rs'
      - 'core/rust/src/cli_app.rs'
      - 'core/rust/src/cli_app/**'
      - 'core/rust/src/lib.rs'
      - 'core/rust/src/direct_wasm.rs'
      - 'core/rust/src/extension.rs'
      - 'core/rust/src/wasmtime_provider.rs'
      - 'core/rust/src/wasm_binding.rs'
      - 'core/rust/src/wasm_binding/**'
      - 'core/spec/wasm-memory-v1.md'
      - 'scripts/runtime/check-wasm-binding'
      - 'scripts/runtime/build-hara-browser'
      - 'scripts/runtime/cargo-wasm-build'
      - 'core/rust/web/package.json'
      - 'core/rust/web/package-lock.json'
      - 'core/rust/web/packages/browser/**'
      - '.github/workflows/wasm-binding.yml'
  push:
    branches: [main, testing]
    paths:
      - 'core/java/pom.xml'
      - 'core/java/src/main/java/hara/truffle/HaraExtensionManifest.java'
      - 'core/java/src/main/java/hara/truffle/HaraExtensionPackage.java'
      - 'core/java/src/main/java/hara/truffle/HaraWasmExtension.java'
      - 'core/java/src/main/java/hara/truffle/HaraWasmMemory*.java'
      - 'core/java/src/test/java/hara/truffle/HaraExtensionManifestTest.java'
      - 'core/java/src/test/java/hara/truffle/HaraWasmMemoryBindingTest.java'
      - 'core/lib/src/tool/cli/extension.hal'
      - 'core/lib/src/tool/cli/handlers.hal'
      - 'core/lib/test/tool/cli/extension_test.hal'
      - 'core/lib/test/tool/cli/handlers_test.hal'
      - 'core/rust/Cargo.toml'
      - 'core/rust/Cargo.lock'
      - 'core/rust/resources/hara-cli-extension-*.edn'
      - 'core/rust/src/bin/hara/cli/hara.rs'
      - 'core/rust/src/cli_app.rs'
      - 'core/rust/src/cli_app/**'
      - 'core/rust/src/lib.rs'
      - 'core/rust/src/direct_wasm.rs'
      - 'core/rust/src/extension.rs'
      - 'core/rust/src/wasmtime_provider.rs'
      - 'core/rust/src/wasm_binding.rs'
      - 'core/rust/src/wasm_binding/**'
      - 'core/spec/wasm-memory-v1.md'
      - 'scripts/runtime/check-wasm-binding'
      - 'scripts/runtime/build-hara-browser'
      - 'scripts/runtime/cargo-wasm-build'
      - 'core/rust/web/package.json'
      - 'core/rust/web/package-lock.json'
      - 'core/rust/web/packages/browser/**'
      - '.github/workflows/wasm-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-binding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Check out hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Check formatting and module bounds
        env:
          WASM_BINDING_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          WASM_BINDING_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/runtime/check-wasm-binding format

      - name: Test the restricted interface, package and memory executor
        run: ./scripts/runtime/check-wasm-binding wasm-binding-tests

      - name: Preserve direct Wasm discovery
        run: ./scripts/runtime/check-wasm-binding direct-tests

      - name: Preserve extension manifest compatibility
        run: ./scripts/runtime/check-wasm-binding extension-tests

      - name: Preserve direct Wasmtime execution
        run: ./scripts/runtime/check-wasm-binding wasmtime-tests

      - name: Validate merged CLI manifests
        run: ./scripts/runtime/check-wasm-binding cli-app-tests

      - name: Execute memory.v1 through JVM and Truffle
        run: ./scripts/runtime/check-wasm-binding jvm-tests

      - name: Run focused Hara command tests
        run: ./scripts/runtime/check-wasm-binding hara-tests

      - name: Check native and browser targets
        run: ./scripts/runtime/check-wasm-binding targets

      - name: Install the matching wasm-bindgen CLI
        shell: bash
        run: |
          version="$(
            cargo metadata --locked \
              --manifest-path core/rust/Cargo.toml \
              --format-version 1 \
            | python3 -c '
          import json, sys
          metadata = json.load(sys.stdin)
          versions = sorted({package["version"] for package in metadata["packages"] if package["name"] == "wasm-bindgen"})
          if len(versions) != 1:
              raise SystemExit(f"expected one wasm-bindgen version, got {versions}")
          print(versions[0])
          '
          )"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/rust/web/package-lock.json

      - name: Execute memory.v1 through the browser SDK
        run: ./scripts/runtime/check-wasm-binding browser-tests

      - name: Confirm validation did not modify source
        run: ./scripts/runtime/check-wasm-binding drift
