name: Rust instrumentation validation

run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('Rust instrumentation · {0} · {1}', github.event.client_payload.ref, github.event.client_payload.request_id)
      || format('Rust instrumentation · {0}', github.ref_name) }}

on:
  pull_request:
    branches:
      - main
      - testing
      - 'instrumentation-*'
    paths:
      - 'core/rust/Cargo.toml'
      - 'core/rust/src/instrumentation.rs'
      - 'core/rust/src/instrumentation/**'
      - 'core/rust/src/fiber.rs'
      - 'core/rust/src/fiber/**'
      - 'core/rust/src/vm/machine.rs'
      - 'core/rust/src/vm/machine/**'
      - '.github/workflows/instrumentation-rust.yml'
  push:
    branches: [main, testing]
    paths:
      - 'core/rust/Cargo.toml'
      - 'core/rust/src/instrumentation.rs'
      - 'core/rust/src/instrumentation/**'
      - 'core/rust/src/fiber.rs'
      - 'core/rust/src/fiber/**'
      - 'core/rust/src/vm/machine.rs'
      - 'core/rust/src/vm/machine/**'
      - '.github/workflows/instrumentation-rust.yml'
  repository_dispatch:
    types: [hara-instrumentation-rust]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-instrumentation-${{ github.event.client_payload.request_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref || github.ref }}

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Check touched Rust formatting
        run: |
          rustfmt --edition 2021 --check \
            core/rust/src/instrumentation.rs \
            core/rust/src/instrumentation/hub.rs \
            core/rust/src/instrumentation/hub/delivery.rs \
            core/rust/src/instrumentation/interpreter.rs \
            core/rust/src/instrumentation/interpreter/tests.rs \
            core/rust/src/instrumentation/hbc.rs \
            core/rust/src/instrumentation/hbc/tests.rs \
            core/rust/src/instrumentation/delivery_tests.rs \
            core/rust/src/fiber/coroutine/observation.rs \
            core/rust/src/fiber/coroutine/semantic.rs \
            core/rust/src/vm/machine/instrumentation.rs \
            core/rust/src/vm/machine/instrumentation/step.rs

      - name: Enforce bounded child modules
        run: |
          files=(
            core/rust/src/instrumentation/hub.rs
            core/rust/src/instrumentation/hub/delivery.rs
            core/rust/src/instrumentation/interpreter.rs
            core/rust/src/instrumentation/interpreter/tests.rs
            core/rust/src/instrumentation/hbc.rs
            core/rust/src/instrumentation/hbc/tests.rs
            core/rust/src/instrumentation/delivery_tests.rs
            core/rust/src/vm/machine/instrumentation/step.rs
          )
          for file in "${files[@]}"; do
            lines=$(wc -l < "$file")
            echo "$file: $lines"
            test "$lines" -lt 700
          done

      - name: Test shared instrumentation hub and delivery
        run: |
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            --package hara-runtime --lib instrumentation

      - name: Test authoritative interpreter probes
        run: |
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            --package hara-runtime --lib core::fiber::coroutine

      - name: Test authoritative HBC probes
        run: |
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            --package hara-runtime --lib vm::machine::instrumentation

      - name: Check feature-minimal library
        run: |
          cargo check --locked --manifest-path core/rust/Cargo.toml \
            --no-default-features --lib

      - name: Check isolated HBC instrumentation feature
        run: |
          cargo check --locked --manifest-path core/rust/Cargo.toml \
            --no-default-features \
            --features bytecode-vm,bytecode-instrumentation \
            --lib

      - name: Compile the instrumented library for browser Wasm
        run: |
          cargo check --locked --manifest-path core/rust/Cargo.toml \
            --target wasm32-unknown-unknown --lib

  report-connector-event:
    if: ${{ always() && github.event_name == 'repository_dispatch' }}
    needs: focused
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report connector event completion
        uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.focused.result }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          EVENT: ${{ github.event.client_payload.event }}
          REF: ${{ github.event.client_payload.ref }}
          ACTOR: ${{ github.event.client_payload.actor }}
          SOURCE_URL: ${{ github.event.client_payload.source_url }}
          WORKFLOW: instrumentation-rust.yml
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER || 0);
            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
              core.notice('No issue was supplied for connector completion reporting.');
              return;
            }
            const clean = (value, limit = 200) => String(value || '')
              .replace(/[\r\n`]/g, '')
              .slice(0, limit);
            const requestId = clean(process.env.REQUEST_ID);
            const event = clean(process.env.EVENT);
            if (!requestId || !event) {
              core.warning('Connector completion payload is missing request identity.');
              return;
            }
            const result = clean(process.env.RESULT || 'unknown', 40);
            const ref = clean(process.env.REF);
            const actor = clean(process.env.ACTOR);
            const workflow = clean(process.env.WORKFLOW);
            const sourceUrl = String(process.env.SOURCE_URL || '').startsWith('https://github.com/')
              ? process.env.SOURCE_URL
              : '';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const marker = `<!-- hara-connector-completion:${requestId}:${event} -->`;
            const icon = result === 'success' ? '✅' : result === 'cancelled' ? '⚪' : '❌';
            const lines = [
              marker,
              `### ${icon} Connector event completed`,
              '',
              `- Event: \`${event}\``,
              `- Ref: \`${ref}\``,
              `- Workflow: \`${workflow}\``,
              `- Result: **${result}**`,
              `- Actor: \`${actor}\``,
              `- Run: ${runUrl}`,
            ];
            if (sourceUrl) lines.push(`- Source request: ${sourceUrl}`);
            const body = lines.join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body,
              });
            }
