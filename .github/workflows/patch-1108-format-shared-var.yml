name: Format issue 1108 shared Truffle Var seam

on:
  push:
    branches:
      - agent/1108-named-declaration-registration
    paths:
      - .github/workflows/patch-1108-format-shared-var.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/1108-named-declaration-registration
          fetch-depth: 0

      - name: Format the shared-Var registration seam
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          context = Path("core/java/src/main/java/hara/truffle/HaraContext.java")
          source = context.read_text()
          old = '''  void defineLibraryValue(
      String namespaceName, String symbolName, Object value, IMetadata metadata) {
    namespace(namespaceName)
        .define(symbolName, value, metadata, HaraVar.Origin.JAVA_LIBRARY);
  }

/** Maps one existing runtime Var into another generated namespace product. */
void referLibraryVar(String namespaceName, String name, HaraVar variable) {
  namespace(namespaceName).refer(name, variable);
}

  void defineLibraryMacro(
'''
          new = '''  void defineLibraryValue(
      String namespaceName, String symbolName, Object value, IMetadata metadata) {
    namespace(namespaceName)
        .define(symbolName, value, metadata, HaraVar.Origin.JAVA_LIBRARY);
  }

  /** Maps one existing runtime Var into another generated namespace product. */
  void referLibraryVar(String namespaceName, String name, HaraVar variable) {
    namespace(namespaceName).refer(name, variable);
  }

  void defineLibraryMacro(
'''
          if source.count(old) != 1:
              raise SystemExit("expected exactly one unformatted shared-Var seam")
          context.write_text(source.replace(old, new, 1))
          Path(".github/workflows/patch-1108-format-shared-var.yml").unlink()
          PY

      - name: Commit the formatting correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/java/src/main/java/hara/truffle/HaraContext.java \
                  .github/workflows/patch-1108-format-shared-var.yml
          git commit -m "style(protocols): format shared Truffle Var seam (#1108)"
          git push origin HEAD:agent/1108-named-declaration-registration
