name: Full runtime conformance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-runtime-conformance
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout hara-specs-registry
      uses: actions/checkout@v4
      with:
        repository: hara-lang/hara-specs-registry
        path: hara-specs-registry
        fetch-depth: 1

    - name: Enforce gw.* HAL namespaces
      run: "! rg --glob '*.hal' 'greenways\\.' ."
    - name: Set up Rust WASM toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown,wasm32-wasip1
        components: clippy
    - name: Check Rust module layout
      run: bash core/rust/scripts/check-layout.sh
    - name: Run Rust Clippy
      # too_many_lines stays warn-only until the oversized hara-wasm CLI
      # functions are split; the stable toolchain floats, and lint drift
      # under -D was blocking the whole workflow (#221).
      run: cargo clippy --manifest-path core/rust/Cargo.toml --all-targets
    - name: Run Rust native tests
      run: cargo test --manifest-path core/rust/Cargo.toml
    - name: Run raw runtime tests
      run: cargo test --manifest-path core/rust/raw/Cargo.toml
    - name: Run raw HTA VM integration tests
      run: cargo test --manifest-path core/rust/raw/Cargo.toml --features bytecode-vm
    - name: Run bytecode VM tests
      run: "cargo test --manifest-path core/rust/Cargo.toml --package hara-runtime --features bytecode-vm vm:: --lib"
    - name: Verify Rust-produced HBC0 conformance artifact
      run: cargo run --quiet --manifest-path core/rust/Cargo.toml --features bytecode-vm --bin hara-bytecode-conformance-artifact -- check
    - name: Run checked tracing JIT tests
      run: "cargo test --manifest-path core/rust/Cargo.toml --package hara-runtime --features tracing-jit jit:: --lib"
    - name: Run native tracing JIT tests
      run: "cargo test --manifest-path core/rust/Cargo.toml --package hara-runtime --features native-jit jit:: --lib"
    - name: Verify generated parity corpus
      run: ./scripts/runtime/generate-wasm-truffle-parity && git diff --exit-code -- hara-specs-registry/01-lang/001-language/draft/conformance/parity/wasm-truffle.edn
    - name: Build raw Rust WASM extension artifact
      run: ./scripts/runtime/build-hara-wasm-raw
    - name: Build browser and WASI Rust runtime artifacts
      run: |
        cargo build --manifest-path core/rust/Cargo.toml --release --target wasm32-unknown-unknown --lib
        cargo build --manifest-path core/rust/Cargo.toml --release --target wasm32-wasip1 --lib
    - name: Record Rust runtime artifact sizes
      run: |
        mkdir -p core/target
        {
          stat -c "browser_wasm_bytes=%s" core/rust/target/wasm32-unknown-unknown/release/hara_wasm.wasm
          stat -c "wasi_wasm_bytes=%s" core/rust/target/wasm32-wasip1/release/hara_wasm.wasm
          stat -c "raw_extension_wasm_bytes=%s" core/rust/raw/target/wasm32-unknown-unknown/browser-release/hara-wasm-vm.wasm
        } | tee core/target/rust-wasm-artifact-sizes.txt
    - name: Upload Rust runtime artifact sizes
      uses: actions/upload-artifact@v4
      with:
        name: rust-wasm-artifact-sizes
        path: core/target/rust-wasm-artifact-sizes.txt
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: core/rust/web/package-lock.json
    - name: Install browser test dependencies
      working-directory: core/rust/web
      run: |
        npm ci
        npx playwright install --with-deps chromium
    - name: Run HTA Node and real-browser conformance
      working-directory: core/rust/web
      run: |
        npm run test:hta
        npm run test:browser
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: core/java/pom.xml
    - name: Build and test with Maven
      run: mvn -B -Ptruffle package --file core/java/pom.xml

    - name: Verify Truffle HIR loads in Rust
      run: |
        ARTIFACT="$PWD/core/java/target/classes/std/foundation.hir"
        test -f "$ARTIFACT"
        test "$(cargo run --quiet --manifest-path core/rust/Cargo.toml --bin hara -- run "$ARTIFACT")" = "<fn>"
        HARA_TRUFFLE_FOUNDATION_HIR="$ARTIFACT" cargo test --manifest-path core/rust/Cargo.toml truffle_compiled_foundation_hir_loads_with_foundation_semantics -- --ignored

    - name: Run library .hal tests
      run: ./scripts/runtime/run-lib-tests

    - name: Run JVM Core-language conformance corpus
      run: mvn -B -Ptruffle -Dtest=hara.truffle.HaraCoreLanguageConformanceTest test --file core/java/pom.xml

    - name: Run Rust WASM and Truffle parity corpus
      run: mvn -B -Ptruffle -Dtest=hara.truffle.HaraWasmTruffleParityTest test --file core/java/pom.xml

    - name: Run JVM core-language benchmark matrix
      run: ./scripts/runtime/run-truffle-benchmark 2 1000 | tee core/target/core-language-benchmark.txt

    - name: Upload JVM core-language benchmark evidence
      uses: actions/upload-artifact@v4
      with:
        name: core-language-benchmark
        path: core/target/core-language-benchmark.txt

    - name: Run runtime corpus benchmark (interpreter-only JVM)
      run: ./scripts/runtime/run-runtime-corpus-benchmark jvm interpreter-temurin core/target/runtime-corpus-interpreter.csv 40 10

    - name: Upload runtime corpus benchmark evidence (interpreter-only JVM)
      uses: actions/upload-artifact@v4
      with:
        name: runtime-corpus-interpreter
        path: core/target/runtime-corpus-interpreter.csv

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: core/java/target/site/jacoco/

  parity-benchmark-slice:
    # The full parity benchmark (1024 cases x cold+warm timings) took ~4.3 h
    # as a single step; round-robin slices run it in parallel.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout hara-specs-registry
      uses: actions/checkout@v4
      with:
        repository: hara-lang/hara-specs-registry
        path: hara-specs-registry
        fetch-depth: 1

    - name: Set up Rust WASM toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Build raw Rust WASM extension artifact
      run: ./scripts/runtime/build-hara-wasm-raw
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: core/java/pom.xml
    - name: Run parity benchmark slice
      run: ./scripts/runtime/run-wasm-truffle-parity-benchmark 3 100 1000 core/target/wasm-truffle-parity-speed-${{ matrix.slice }}.csv ${{ matrix.slice }} 8
    - name: Upload parity benchmark slice
      uses: actions/upload-artifact@v4
      with:
        name: wasm-truffle-parity-speed-${{ matrix.slice }}
        path: core/target/wasm-truffle-parity-speed-${{ matrix.slice }}.csv

  parity-benchmark-merge:
    runs-on: ubuntu-latest
    needs: parity-benchmark-slice

    steps:
    - name: Download parity benchmark slices
      uses: actions/download-artifact@v4
      with:
        pattern: wasm-truffle-parity-speed-*
        path: slices
        merge-multiple: true
    - name: Merge parity benchmark CSV
      run: |
        mkdir -p core/target
        {
          head -n 1 "$(ls slices/wasm-truffle-parity-speed-*.csv | head -n 1)"
          tail -qn +2 slices/wasm-truffle-parity-speed-*.csv | sort
        } > core/target/wasm-truffle-parity-speed.csv
        wc -l core/target/wasm-truffle-parity-speed.csv
    - name: Upload merged parity speed report
      uses: actions/upload-artifact@v4
      with:
        name: wasm-truffle-parity-speed
        path: core/target/wasm-truffle-parity-speed.csv

  native-image-smoke:
    runs-on: ubuntu-latest
    env:
      HARA_NATIVE_USE_FALLBACK_RUNTIME: 'true'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout hara-specs-registry
      uses: actions/checkout@v4
      with:
        repository: hara-lang/hara-specs-registry
        path: hara-specs-registry
        fetch-depth: 1

    - name: Set up Rust WASM toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Build raw Rust WASM extension artifact
      run: ./scripts/runtime/build-hara-wasm-raw
    - name: Verify Rust-produced HBC0 conformance artifact
      run: cargo run --quiet --manifest-path core/rust/Cargo.toml --features bytecode-vm --bin hara-bytecode-conformance-artifact -- check
    - name: Set up GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        version: '25.0.3'
        distribution: 'graalvm'
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Build the Truffle Native Image
      env:
        HARA_NATIVE_USE_FALLBACK_RUNTIME: 'true'
      run: ./scripts/runtime/build-truffle-native
    - name: Record Native Image build and startup metrics
      run: |
        {
          echo "native_image_version=$(native-image --version)"
          echo "native_runtime_mode=fallback"
          echo "binary_bytes=$(stat -c '%s' core/target/hara-truffle)"
          /usr/bin/time -f 'startup_seconds=%e' core/target/hara-truffle eval 'nil' >/dev/null
          echo "reachability_manifest=$(find core/java/target/classes/META-INF/native-image -type f -print | sort | tr '\n' ',')"
        } 2>&1 | tee core/target/native-image-metrics.txt
    - name: Run a Native Image smoke test
      run: |
        mkdir -p core/target/native-extensions/demo/000-answer-42
        cp core/rust/raw/target/wasm32-unknown-unknown/browser-release/hara-wasm-vm.wasm \
          core/target/native-extensions/demo/000-answer-42/answer-42.wasm
        cp core/lib/examples/extensions/demo/000-answer-42/hara.extension.edn \
          core/target/native-extensions/demo/000-answer-42/hara.extension.edn
        mkdir -p core/target/native-extensions/hara/runtime/wasm
        cp core/rust/raw/target/wasm32-unknown-unknown/browser-release/hara-wasm-vm.wasm \
          core/target/native-extensions/hara/runtime/wasm/hara.wasm
        cp core/lib/examples/extensions/hara/runtime/wasm/hara.extension.edn \
          core/target/native-extensions/hara/runtime/wasm/hara.extension.edn
        test "$(core/target/hara-truffle conformance)" = "Core-language conformance passed: 146 cases"
        test "$(HARA_EXTENSION_PATH="$PWD/core/target/native-extensions" core/target/hara-truffle eval '(ns app (:require [demo.000-answer-42 :as answer])) (answer/add 20 22)')" = "42"
        test "$(core/target/hara-truffle eval '(+ 19 23)')" = "42"
        test "$(core/target/hara-truffle eval '(bytes/u8 -1)')" = "255"
        test "$(core/target/hara-truffle eval '(ICount/count (bytes 1 2 3))')" = "3"
        test "$(core/target/hara-truffle eval '(let [a (array 1 2)] (do (. a (set 1 7)) (. a (get 1))))')" = "7"
        test "$(core/target/hara-truffle eval '(defstruct Person [name]) (ILookup/lookup (IObjType/meta (IObjType/with-meta (Person "Ada") {:doc :person})) :doc)')" = ":person"
        test "$(core/target/hara-truffle eval '(= -0.0 0.0)')" = "true"
        test "$(core/target/hara-truffle eval '(= 1.0 1.00)')" = "true"
        test "$(core/target/hara-truffle eval '(def ^:dynamic *answer* 1) (binding [*answer* 42] *answer*)')" = "42"
        test "$(core/target/hara-truffle eval '(def answer 1) (set! answer 42) answer')" = "42"
        test "$(core/target/hara-truffle eval '(let [it (concat [1] [2])] (iter-next it) (iter-next it))')" = "2"
        test "$(core/target/hara-truffle eval '(def answer 1) (defn add [x y] (+ x y)) (alter-var-root (var answer) add 41) answer')" = "42"
        test "$(core/target/hara-truffle eval '(defn sum3 [a b c] (+ a b c)) (apply sum3 1 [2 3])')" = "6"
        test "$(core/target/hara-truffle eval '(defstruct Problem [value]) (try (throw (Problem 7)) (catch Other error 0) (catch Problem error (field error :value)))')" = "7"
        test "$(core/target/hara-truffle eval '(ns source) (def answer 1) (ns user) (refer "source") (in-ns (quote source)) (set! answer 2) (in-ns (quote user)) answer')" = "2"
        test "$(core/target/hara-truffle eval '(load-resource "hara/core-language-resource.hal")')" = "42"
        test "$(core/target/hara-truffle eval '(load-resource "std/foundation.hal") ((comp inc inc inc inc) 38)')" = "42"
        test "$(core/target/hara-truffle eval '(require "std/foundation.hal") ((comp inc inc inc inc) 38)')" = "42"
        test "$(core/target/hara-truffle eval '(defmulti kind (fn [x] (if (= x 1) :one :other))) (defmethod kind :one [x] :one) (defmethod kind :default [x] :other) (kind 2)')" = ":other"
        test "$(core/target/hara-truffle eval '(do (defmacro unless [test body] `(if ~test nil ~body)) (unless false 42))')" = "42"
        test "$(core/target/hara-truffle eval '(do (declare answer) (def answer 42) (defn- read-answer [] answer) (read-answer))')" = "42"
        core/target/hara-truffle bytecode conformance core/rust/assets/bytecode-conformance.hcc \
          | tee core/target/native-image-hbc-alpha-conformance.txt
        grep -Eq '^HBC0 conformance passed: [1-9][0-9]+ cases$' core/target/native-image-hbc-alpha-conformance.txt
        core/target/hara-truffle bytecode run core/rust/assets/std.foundation.hbx > /dev/null
        core/target/hara-truffle bytecode disassemble core/rust/assets/std.foundation.hbx > core/target/native-image-hbx-alpha-disassembly.txt
        test "$(grep -c '^module ' core/target/native-image-hbx-alpha-disassembly.txt)" -eq "$(wc -l < core/rust/standard-library.namespaces)"
        grep -q '^module std.foundation$' core/target/native-image-hbx-alpha-disassembly.txt
        grep -q '^module lang.core$' core/target/native-image-hbx-alpha-disassembly.txt
    - name: Run runtime corpus benchmark (GraalVM JVMCI)
      run: ./scripts/runtime/run-runtime-corpus-benchmark jvm jvmci-graalvm core/target/runtime-corpus-jvmci.csv 40 10
    - name: Run runtime corpus benchmark (Native Image fallback)
      run: ./scripts/runtime/run-runtime-corpus-benchmark bin native-fallback core/target/runtime-corpus-native.csv 40 10 core/target/hara-truffle fallback
    - name: Upload Native Image evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-image-evidence
        path: |
          core/target/native-image-metrics.txt
          core/target/hara-truffle
          core/target/*build_report*
          core/target/runtime-corpus-jvmci.csv
          core/target/runtime-corpus-native.csv
          core/target/native-image-hbc-alpha-conformance.txt
          core/target/native-image-hbx-alpha-disassembly.txt
