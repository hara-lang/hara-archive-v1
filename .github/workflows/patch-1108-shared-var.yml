name: Patch issue 1108 shared Truffle Var projection

on:
  push:
    branches:
      - agent/1108-named-declaration-registration
    paths:
      - .github/workflows/patch-1108-shared-var.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/1108-named-declaration-registration
          fetch-depth: 0

      - name: Add the bounded shared-Var registration seam
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("core/java/src/main/java/hara/truffle/HaraContext.java")
          source = path.read_text()
          if "void referLibraryVar(" in source:
              raise SystemExit("referLibraryVar is already present")

          match = re.search(r"\n  (?:public )?void defineLibraryValue\(", source)
          if match is None:
              raise SystemExit("defineLibraryValue method was not found")

          opening = source.find("{", match.start())
          if opening < 0:
              raise SystemExit("defineLibraryValue opening brace was not found")
          depth = 0
          closing = None
          for index in range(opening, len(source)):
              character = source[index]
              if character == "{":
                  depth += 1
              elif character == "}":
                  depth -= 1
                  if depth == 0:
                      closing = index + 1
                      break
          if closing is None:
              raise SystemExit("defineLibraryValue closing brace was not found")

          addition = '''

          /** Maps one existing runtime Var into another generated namespace product. */
          void referLibraryVar(String namespaceName, String name, HaraVar variable) {
            namespace(namespaceName).refer(name, variable);
          }'''
          path.write_text(source[:closing] + addition + source[closing:])
          Path(".github/workflows/patch-1108-shared-var.yml").unlink()
          PY

      - name: Commit the focused runtime seam
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/java/src/main/java/hara/truffle/HaraContext.java \
                  .github/workflows/patch-1108-shared-var.yml
          git commit -m "feat(protocols): add shared Truffle Var projection (#1108)"
          git push origin HEAD:agent/1108-named-declaration-registration
