name: Lang JS, Python, and Lua runtime

on:
  push:
    branches: [main, testing]
    paths:
      - 'core/lib/src/code/deploy/runtime.hal'
      - 'core/lib/src/code/test/**'
      - 'core/lib/src/code/translate/**'
      - 'core/lib/src/lang/**'
      - 'core/lib/src/lib/docker.hal'
      - 'core/lib/src/tool/runtime.hal'
      - 'core/lib/src/tool/cli/identity.hal'
      - 'core/lib/src/tool/cli/project_command.hal'
      - 'core/lib/src-lang/xt/lang/**'
      - 'core/lib/src/hara/runtime.hal'
      - 'core/rust/Cargo.toml'
      - 'core/rust/Cargo.lock'
      - 'core/rust/abi/**'
      - 'core/rust/assets/std.foundation.hbx'
      - 'core/rust/src/bin/hara-foundation-artifact.rs'
      - 'core/rust/src/core.rs'
      - 'core/rust/src/native_module.rs'
      - 'core/rust/src/numeric.rs'
      - 'core/java/pom.xml'
      - 'core/lib/test-lang/lang/**'
      - 'core/lib/test-lang/xt/lang/**'
      - 'core/lib/test/hara/runtime_test.hal'
      - 'core/lib/integration/hara/lang_bootstrap_probe.hal'
      - 'core/lib/integration/hara/runtime_smoke.hal'
      - 'scripts/runtime/process_static_object_audit.py'
      - 'scripts/runtime/process_static_object_audit_test.py'
      - 'scripts/runtime/run-hara-runtime-smoke'
      - 'scripts/runtime/sync-rust-hal-src'
      - '.github/workflows/lang-runtime.yml'
  pull_request:
    branches: [main, testing]
    paths:
      - 'core/lib/src/code/deploy/runtime.hal'
      - 'core/lib/src/code/test/**'
      - 'core/lib/src/code/translate/**'
      - 'core/lib/src/lang/**'
      - 'core/lib/src/lib/docker.hal'
      - 'core/lib/src/tool/runtime.hal'
      - 'core/lib/src/tool/cli/identity.hal'
      - 'core/lib/src/tool/cli/project_command.hal'
      - 'core/lib/src-lang/xt/lang/**'
      - 'core/lib/src/hara/runtime.hal'
      - 'core/rust/Cargo.toml'
      - 'core/rust/Cargo.lock'
      - 'core/rust/abi/**'
      - 'core/rust/assets/std.foundation.hbx'
      - 'core/rust/src/bin/hara-foundation-artifact.rs'
      - 'core/rust/src/core.rs'
      - 'core/rust/src/native_module.rs'
      - 'core/rust/src/numeric.rs'
      - 'core/java/pom.xml'
      - 'core/lib/test-lang/lang/**'
      - 'core/lib/test-lang/xt/lang/**'
      - 'core/lib/test/hara/runtime_test.hal'
      - 'core/lib/integration/hara/lang_bootstrap_probe.hal'
      - 'core/lib/integration/hara/runtime_smoke.hal'
      - 'scripts/runtime/process_static_object_audit.py'
      - 'scripts/runtime/process_static_object_audit_test.py'
      - 'scripts/runtime/run-hara-runtime-smoke'
      - 'scripts/runtime/sync-rust-hal-src'
      - '.github/workflows/lang-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lang-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1
      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical Process calls
        run: |
          python3 scripts/runtime/process_static_object_audit_test.py
          python3 scripts/runtime/process_static_object_audit.py
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          lua -v
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Generate the current standard-library HBX bundle
        run: cargo run --quiet --manifest-path core/rust/Cargo.toml --features bytecode-vm --bin hara-foundation-artifact -- generate
      - name: Upload the generated standard-library HBX bundle
        uses: actions/upload-artifact@v4
        with:
          name: std-foundation-hbx-${{ github.event.pull_request.head.sha || github.sha }}
          path: core/rust/assets/std.foundation.hbx
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: core/java/pom.xml
      - name: Build Hara Truffle runtime
        run: mvn -B -Ptruffle -DskipTests package --file core/java/pom.xml
      - name: Execute the Hara bootstrap probe
        run: core/hara --project core run core/lib/integration/hara/lang_bootstrap_probe.hal
      - name: Execute emitted JavaScript, Python, and Lua
        run: |
          runtime_command=(
            core/hara
            --project
            core
            --allow-net
            --allow-process
            run
            core/lib/integration/hara/runtime_smoke.hal
          )
          if command -v timeout >/dev/null 2>&1; then
            timeout 90s "${runtime_command[@]}"
          else
            "${runtime_command[@]}"
          fi
