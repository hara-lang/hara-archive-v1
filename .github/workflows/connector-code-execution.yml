name: Connector code execution

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'agent/**'
      - 'chat/**'
      - 'codex/**'
      - 'copilot/**'
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch used to classify a manually dispatched ref
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: connector-code-execution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Resolve committed language scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      java: ${{ steps.scope.outputs.java }}
      hal: ${{ steps.scope.outputs.hal }}
      wasm: ${{ steps.scope.outputs.wasm }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate connector execution scripts
        shell: bash
        run: |
          bash -n scripts/runtime/detect-connector-code-scope
          bash -n scripts/runtime/run-connector-code
          bash scripts/runtime/detect-connector-code-scope --self-test

      - name: Detect committed Rust and Java scope
        id: scope
        shell: bash
        env:
          CONNECTOR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONNECTOR_BASE_REF: ${{ github.event.pull_request.base.ref || inputs.base_ref || 'main' }}
          CONNECTOR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/runtime/detect-connector-code-scope

  rust:
    name: Agent readiness / Rust
    needs: contract
    if: ${{ needs.contract.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.contract.outputs.head_sha }}
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/rust/target
          key: connector-rust-${{ runner.os }}-${{ hashFiles('core/rust/Cargo.lock') }}
          restore-keys: |
            connector-rust-${{ runner.os }}-

      - name: Run committed Rust validation
        shell: bash
        env:
          CONNECTOR_BASE_SHA: ${{ needs.contract.outputs.base_sha }}
          CONNECTOR_HEAD_SHA: ${{ needs.contract.outputs.head_sha }}
          CONNECTOR_FORMAT_SCOPE: changed
        run: bash scripts/runtime/run-connector-code rust

      - name: Capture Rust evidence
        if: always()
        shell: bash
        run: |
          {
            printf 'head_sha=%s\n' '${{ needs.contract.outputs.head_sha }}'
            rustc --version
            cargo --version
          } > connector-rust-evidence.txt

      - name: Upload Rust evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connector-rust-${{ needs.contract.outputs.head_sha }}
          path: connector-rust-evidence.txt
          if-no-files-found: error
          retention-days: 7

  java:
    name: Agent readiness / Java
    needs: contract
    if: ${{ needs.contract.outputs.java == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.contract.outputs.head_sha }}

      - name: Check out the specifications registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          ref: a40b7da53ed8e4ef241e36a9fd2802b3bc34ea8a
          fetch-depth: 1

      - name: Expose the specifications registry at the sibling path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Run committed Java validation
        shell: bash
        run: bash scripts/runtime/run-connector-code java

      - name: Capture Java evidence
        if: always()
        shell: bash
        run: |
          {
            printf 'head_sha=%s\n' '${{ needs.contract.outputs.head_sha }}'
            java -version
            mvn --version | head -n 3
          } > connector-java-evidence.txt 2>&1

      - name: Upload Java evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connector-java-${{ needs.contract.outputs.head_sha }}
          path: connector-java-evidence.txt
          if-no-files-found: error
          retention-days: 7

  hal:
    name: Agent readiness / Hara
    needs: contract
    if: ${{ needs.contract.outputs.hal == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.contract.outputs.head_sha }}

      - name: Check out the specifications registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          ref: a40b7da53ed8e4ef241e36a9fd2802b3bc34ea8a
          fetch-depth: 1

      - name: Expose the specifications registry at the sibling path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/rust/target
          key: connector-hal-${{ runner.os }}-${{ hashFiles('core/rust/Cargo.lock') }}
          restore-keys: |
            connector-hal-${{ runner.os }}-

      - name: Run committed Hara validation
        shell: bash
        run: bash scripts/runtime/run-connector-code hal

      - name: Capture Hara evidence
        if: always()
        shell: bash
        run: |
          {
            printf 'head_sha=%s\n' '${{ needs.contract.outputs.head_sha }}'
            rustc --version
            cargo --version
          } > connector-hal-evidence.txt

      - name: Upload Hara evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connector-hal-${{ needs.contract.outputs.head_sha }}
          path: connector-hal-evidence.txt
          if-no-files-found: error
          retention-days: 7

  wasm:
    name: Agent readiness / Wasm
    needs: contract
    if: ${{ needs.contract.outputs.wasm == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.contract.outputs.head_sha }}

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/rust/web/package-lock.json

      - name: Run committed Wasm validation
        shell: bash
        run: bash scripts/runtime/run-connector-code wasm

      - name: Capture Wasm evidence
        if: always()
        shell: bash
        run: |
          {
            printf 'head_sha=%s\n' '${{ needs.contract.outputs.head_sha }}'
            node --version
            npm --version
          } > connector-wasm-evidence.txt

      - name: Upload Wasm evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connector-wasm-${{ needs.contract.outputs.head_sha }}
          path: connector-wasm-evidence.txt
          if-no-files-found: error
          retention-days: 7

  evidence:
    name: Agent readiness / Required gate
    needs: [contract, rust, java, hal, wasm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected language job to pass
        shell: bash
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          RUST_SELECTED: ${{ needs.contract.outputs.rust }}
          RUST_RESULT: ${{ needs.rust.result }}
          JAVA_SELECTED: ${{ needs.contract.outputs.java }}
          JAVA_RESULT: ${{ needs.java.result }}
          HAL_SELECTED: ${{ needs.contract.outputs.hal }}
          HAL_RESULT: ${{ needs.hal.result }}
          WASM_SELECTED: ${{ needs.contract.outputs.wasm }}
          WASM_RESULT: ${{ needs.wasm.result }}
          BASE_SHA: ${{ needs.contract.outputs.base_sha }}
          HEAD_SHA: ${{ needs.contract.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$CONTRACT_RESULT" = success

          if [[ "$RUST_SELECTED" = true ]]; then
            test "$RUST_RESULT" = success
          else
            test "$RUST_RESULT" = skipped
          fi

          if [[ "$JAVA_SELECTED" = true ]]; then
            test "$JAVA_RESULT" = success
          else
            test "$JAVA_RESULT" = skipped
          fi

          if [[ "$HAL_SELECTED" = true ]]; then
            test "$HAL_RESULT" = success
          else
            test "$HAL_RESULT" = skipped
          fi

          if [[ "$WASM_SELECTED" = true ]]; then
            test "$WASM_RESULT" = success
          else
            test "$WASM_RESULT" = skipped
          fi

          {
            printf '### Connector code execution\n\n'
            printf -- '- Base: `%s`\n' "$BASE_SHA"
            printf -- '- Head: `%s`\n' "$HEAD_SHA"
            printf -- '- Rust selected: `%s` (`%s`)\n' "$RUST_SELECTED" "$RUST_RESULT"
            printf -- '- Java selected: `%s` (`%s`)\n' "$JAVA_SELECTED" "$JAVA_RESULT"
            printf -- '- Hara selected: `%s` (`%s`)\n' "$HAL_SELECTED" "$HAL_RESULT"
            printf -- '- Wasm selected: `%s` (`%s`)\n' "$WASM_SELECTED" "$WASM_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
