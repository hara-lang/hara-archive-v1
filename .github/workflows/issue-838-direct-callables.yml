name: Issue 838 direct callable catalog

on:
  pull_request:
    branches: [main, testing]
    paths:
      - '.github/workflows/issue-838-direct-callables.yml'
      - 'core/rust/Cargo.toml'
      - 'core/rust/Cargo.lock'
      - 'core/rust/src/**'
      - 'core/rust/raw/**'
      - 'core/lib/src/std/foundation.hal'
      - 'core/lib/src/std/foundation/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-838-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SPECS_FIXTURE: 01-lang/004-foundation/draft/conformance/fixtures/foundation_behavioral.hal
  SPECS_REVISION: f0c9f72c6c22ef7b9a3df4f996dc35e72e35fe44

jobs:
  catalog:
    name: Catalog closure and zero evaluator re-entry
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Checkout authoritative specs registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          ref: ${{ env.SPECS_REVISION }}
          path: hara-specs-registry
          fetch-depth: 1

      - name: Require and expose authoritative fixtures
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/hara-specs-registry/$SPECS_FIXTURE"
          ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" \
            "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting of the direct-native regression suite
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --config skip_children=true --check \
            core/rust/tests/direct_native_runtime.rs

      - name: Run the current direct-native catalog and boundary suites
        run: |
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            --test direct_native_runtime -- --nocapture
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            -p hara-runtime --features direct-native direct_native_ --lib -- --nocapture
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            -p hara-runtime --features direct-native \
            native_bytes_calls_terminate_without_reentering_the_hal_facade --lib -- --nocapture
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            -p hara-runtime --features direct-native \
            native_string_calls_terminate_without_reentering_the_hal_facade --lib -- --nocapture
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            -p hara-runtime --features direct-native \
            qualified_hal_facades_do_not_override_native_type_aliases --lib -- --nocapture
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            -p hara-runtime --features direct-native \
            rust_native_work_handles_are_available_to_guest_hara --lib

      - name: Check supported feature profiles
        run: |
          cargo check --locked --manifest-path core/rust/Cargo.toml --all-targets
          cargo check --locked --manifest-path core/rust/Cargo.toml \
            --no-default-features --lib
          cargo check --locked --manifest-path core/rust/raw/Cargo.toml

  bytecode:
    name: Tree, fiber, and bytecode VM parity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Checkout authoritative specs registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          ref: ${{ env.SPECS_REVISION }}
          path: hara-specs-registry
          fetch-depth: 1

      - name: Require and expose authoritative fixtures
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/hara-specs-registry/$SPECS_FIXTURE"
          ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" \
            "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Checkout benchmark corpus
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-benchmarks
          ref: 05234295ac1c706eb1adee505873b10783d42163
          path: hara-benchmarks
          fetch-depth: 1

      - name: Expose benchmark corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/../../website"
          ln -sfn "$GITHUB_WORKSPACE/hara-benchmarks" \
            "$GITHUB_WORKSPACE/../../website/hara-benchmarks"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run focused evaluator and VM machine suites
        run: |
          cargo test --locked --manifest-path core/rust/Cargo.toml fiber:: --lib
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            --features bytecode-vm vm::machine:: --lib

      - name: Run bytecode VM execution suite (baseline has pre-existing failures)
        continue-on-error: true
        run: |
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            --features bytecode-vm vm::execution_tests --lib

  foundation:
    name: Specs-owned Foundation and Wasm targets
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Checkout authoritative specs registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          ref: ${{ env.SPECS_REVISION }}
          path: hara-specs-registry
          fetch-depth: 1

      - name: Require and expose authoritative fixtures
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/hara-specs-registry/$SPECS_FIXTURE"
          ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" \
            "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run authoritative Foundation and protocol corpora
        run: |
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            -p hara-runtime --features direct-native \
            specs_owned_foundation_behavioral_corpus_runs_in_the_native_runtime --lib
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            -p hara-runtime --features direct-native \
            shared_foundation_protocol_conformance_fixture_runs_in_the_native_runtime --lib
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            -p hara-runtime --features direct-native \
            shared_foundation_protocol_functionality_fixture_runs_in_the_native_runtime --lib

      - name: Check raw, browser, and minimal Wasm targets
        run: |
          cargo check --locked --manifest-path core/rust/raw/Cargo.toml
          cargo check --locked --manifest-path core/rust/Cargo.toml \
            --target wasm32-unknown-unknown --lib
          cargo check --locked --manifest-path core/rust/Cargo.toml \
            --target wasm32-unknown-unknown \
            --no-default-features --lib

  work-and-release:
    name: Work suites and production-stack release baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    needs: [catalog, bytecode, foundation]
    env:
      RUST_MIN_STACK: 33554432
    steps:
      - uses: actions/checkout@v4

      - name: Checkout authoritative specs registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          ref: ${{ env.SPECS_REVISION }}
          path: hara-specs-registry
          fetch-depth: 1

      - name: Require and expose authoritative fixtures
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/hara-specs-registry/$SPECS_FIXTURE"
          ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" \
            "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Checkout benchmark corpus
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-benchmarks
          ref: 05234295ac1c706eb1adee505873b10783d42163
          path: hara-benchmarks
          fetch-depth: 1

      - name: Expose benchmark corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/../../website"
          ln -sfn "$GITHUB_WORKSPACE/hara-benchmarks" \
            "$GITHUB_WORKSPACE/../../website/hara-benchmarks"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Work protocol, evaluator, and compiler suites
        run: |
          cargo test --locked --manifest-path core/rust/Cargo.toml work:: --lib
          cargo test --locked --manifest-path core/rust/Cargo.toml \
            --features bytecode-vm work --lib
