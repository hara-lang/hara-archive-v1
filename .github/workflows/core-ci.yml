name: Core CI

on:
  pull_request:
    branches: [main, testing]
  push:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      run_core: ${{ steps.scope.outputs.run_core }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Checkout hara-benchmarks
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-benchmarks
          ref: 05234295ac1c706eb1adee505873b10783d42163
          path: hara-benchmarks
          fetch-depth: 1

      - name: Expose benchmark corpus at the differential fixture path
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../../website"
          ln -sfn \
            "$GITHUB_WORKSPACE/hara-benchmarks" \
            "$GITHUB_WORKSPACE/../../website/hara-benchmarks"

      - name: Detect core changes
        id: scope
        shell: bash
        run: |
          event="${{ github.event_name }}"
          case "$event" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              ;;
            *)
              echo "run_core=true" >> "$GITHUB_OUTPUT"
              echo "Running core validation for $event."
              exit 0
              ;;
          esac

          # A newly created branch has an all-zero `before` SHA. There is no
          # reliable comparison range in that case, so keep the conservative
          # behaviour and run the full core suite.
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || \
             ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run_core=true" >> "$GITHUB_OUTPUT"
            echo "No valid base commit; running core validation."
            exit 0
          fi

          # Browser and Studio assets live under core/rust/web for packaging, and
          # shipped examples live under core/lib/examples. Neither is a Cargo or
          # JVM core input. Their dedicated workflows build/validate them, so do
          # not make pre-existing native runtime failures block isolated web or
          # example-corpus changes.
          if git diff --quiet "$base" "$head" -- \
            core/rust \
            ':(exclude)core/rust/web' \
            core/java \
            core/lib \
            ':(exclude)core/lib/examples' \
            contrib \
            hara-specs-registry \
            scripts/runtime/run-lib-tests \
            scripts/runtime/check-work-flow-make-clean \
            scripts/runtime/check_work_flow_make_clean.py \
            scripts/runtime/check_work_flow_make_clean_test.py; then
            echo "run_core=false" >> "$GITHUB_OUTPUT"
            echo "No core runtime changes detected."
          else
            echo "run_core=true" >> "$GITHUB_OUTPUT"
            echo "Core runtime changes detected."
          fi

      - name: Enforce gw.* HAL namespaces
        if: steps.scope.outputs.run_core == 'true'
        shell: bash
        run: |
          if git grep -n -E '^[[:space:]]*\(ns[[:space:]]+greenways\.' -- 'core/**/*.hal'; then
            echo "HAL namespaces must use gw.* rather than greenways.*" >&2
            exit 1
          fi

      - name: Reject Work make scratch outputs
        if: steps.scope.outputs.run_core == 'true'
        run: bash scripts/runtime/check-work-flow-make-clean

      - name: Test Work make scratch audit
        if: steps.scope.outputs.run_core == 'true'
        run: python3 scripts/runtime/check_work_flow_make_clean_test.py

      - name: Set up Rust
        if: steps.scope.outputs.run_core == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check Rust module layout
        if: steps.scope.outputs.run_core == 'true'
        run: |
          bash core/rust/scripts/check-layout.test.sh
          bash core/rust/scripts/check-layout.sh

      - name: Check Rust
        if: steps.scope.outputs.run_core == 'true'
        run: |
          cargo clippy --manifest-path core/rust/Cargo.toml --all-targets
          cargo test --manifest-path core/rust/Cargo.toml
          cargo test --manifest-path core/rust/raw/Cargo.toml

      - name: Set up JDK 21
        if: steps.scope.outputs.run_core == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: core/java/pom.xml

      - name: Build and test Java runtime
        if: steps.scope.outputs.run_core == 'true'
        working-directory: core
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/hara-java-maven.log"
          mvn -B -Ptruffle package --file java/pom.xml >"$log" 2>&1
          status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "::group::Java Maven failure summary"
            grep -E '^\[(ERROR|WARNING)\]|Tests run:|Failures:|Errors:|Skipped:|<<< FAILURE!|There are test failures|BUILD FAILURE|Caused by:' "$log" \
              | tail -n 240 || true
            echo "::endgroup::"
            echo "::group::Java Maven failure tail"
            tail -n 320 "$log"
            echo "::endgroup::"
            exit "$status"
          fi
          tail -n 80 "$log"

      - name: Run library HAL tests
        if: steps.scope.outputs.run_core == 'true'
        run: ./scripts/runtime/run-lib-tests

  bytecode-observation:
    name: Live bytecode observation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate
    if: needs.validate.outputs.run_core == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Checkout hara-specs-registry
        uses: actions/checkout@v4
        with:
          repository: hara-lang/hara-specs-registry
          path: hara-specs-registry
          fetch-depth: 1

      - name: Expose specs registry at the runtime fixture path
        run: ln -sfn "$GITHUB_WORKSPACE/hara-specs-registry" "$GITHUB_WORKSPACE/../hara-specs-registry"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Check native observed sessions
        run: |
          cargo clippy --manifest-path core/rust/Cargo.toml \
            --features code-vm-conformance \
            --lib --no-deps
          cargo test --manifest-path core/rust/Cargo.toml \
            --features code-vm-conformance \
            vm::session:: --lib
          cargo test --manifest-path core/rust/Cargo.toml \
            --features code-vm-conformance \
            vm::conformance:: --lib
          cargo run --manifest-path core/rust/Cargo.toml \
            --features code-vm-conformance \
            --bin hara-code-vm-conformance -- check

      - name: Check browser observed sessions
        run: |
          cargo check --manifest-path core/rust/Cargo.toml \
            --target wasm32-unknown-unknown \
            --features code-vm-conformance \
            --lib
