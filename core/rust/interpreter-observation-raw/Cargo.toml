[package]
name = "hara-interpreter-observation-raw"
version = "0.1.6"
edition = "2021"
description = "On-demand browser-safe live interpreter observation runtime for Hara"
license = "Apache-2.0"
rust-version = "1.78"
repository = "https://github.com/hara-lang/hara"
homepage = "https://www.hara-lang.org"
publish = false

# Keep the C ABI outside the ordinary runtime workspace. The implementation
# and session ownership live in hara-runtime so this facade cannot drift from the
# production evaluator or duplicate its module graph.
[workspace]

[lib]
name = "hara_interpreter_observation_raw"
crate-type = ["cdylib", "rlib"]

[profile.browser-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
hara-runtime = { path = "../runtime", default-features = false, features = ["bytecode-vm"] }

[patch."https://github.com/hara-lang/hara.git"]
hara-abi = { path = "../abi" }
