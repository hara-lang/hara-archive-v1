[package]
name = "hara-wasm"
version = "0.1.6"
edition = "2021"
description = "Portable browser runtime slice for Hara"
license = "Apache-2.0"
rust-version = "1.78"
repository = "https://github.com/hara-lang/hara"
homepage = "https://www.hara-lang.org"
documentation = "https://docs.rs/hara-wasm"
include = [
  "Cargo.lock",
  "Cargo.toml",
  "assets/**",
  "build.rs",
  "bootstrap.namespaces",
  "cli-bootstrap.namespaces",
  "clippy.toml",
  "examples/**",
  "hal-src/**/*.hal",
  "hal-test-fixtures/**",
  "resources/**",
  "scripts/**",
  "src/**",
  "standard-library.namespaces",
  "tests/**",
  "web/**",
]

[workspace]
members = [
  ".",
  "abi",
  "compiler",
  "hta-codec",
  "protocol-macros",
  "raw",
  "runtime",
  "vm-runtime",
]
default-members = ["."]
resolver = "2"

[patch."https://github.com/hara-lang/hara.git"]
hara-abi = { path = "abi" }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The shared instrumentation hub is always present. The default native runtime
# also compiles the copy-only HBC probe seam; ordinary Machine::run still takes
# the unchanged no-probe path and performs no event or projection work.
default = [
  "bytecode-vm",
  "bytecode-instrumentation",
  "browser-wasm",
  "direct-native",
]
evaluation-journal = ["hara-runtime/evaluation-journal"]
dev-trace = ["hara-runtime/dev-trace"]
halc-encoder = ["hara-runtime/halc-encoder"]
hir-encoder = ["hara-runtime/hir-encoder"]
bytecode-vm = ["hara-runtime/bytecode-vm"]
bytecode-instrumentation = ["hara-runtime/bytecode-instrumentation"]
bytecode-observation = ["hara-runtime/bytecode-observation"]
code-vm-conformance = ["hara-runtime/code-vm-conformance"]
raw-wasm = ["hara-runtime/raw-wasm"]
browser-wasm = ["hara-runtime/browser-wasm"]
tracing-jit = ["hara-runtime/tracing-jit"]
native-jit = ["hara-runtime/native-jit"]
direct-native = ["hara-runtime/direct-native"]
whole-wasm = ["hara-runtime/whole-wasm"]
# Structured Evaluation Journal. Keep this opt-in so embedded and production
# builds do not carry collectors or journal storage.
# Existing optional encoder gate (declared here so Cargo can validate it).
# The staged bytecode VM is enabled by the main crate's default feature set.
# Entry points remain gated so compiler-free and feature-minimal crates can
# consume the shared VM substrate without enabling the compiler surface.
# Compact counters, events and one-boundary scalar probes. Ordinary
# Machine::run remains unchanged and no portable projection is materialized
# until the shared hub matches a registration.
# Opt-in bounded snapshots and compatibility one-boundary stepping for
# Hodos/code.vm. New instrumentation probes do not depend on these eager
# before/after snapshots.
# Production-generated interpreter/HALC/bytecode corpus and report.
# Shared VM source can be compiled into a plain-C Wasm facade without the
# browser-only wasm-bindgen session wrapper. Normal hara-wasm builds keep it.

[profile.browser-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
hara-runtime = { version = "0.1.6", path = "runtime", default-features = false }
wasm-bindgen = "0.2"
sha2 = "0.10"
hmac = "0.12"
regex = "1.11"
serde_json = "1.0"
getrandom = { version = "0.2", features = ["js"] }
ed25519-dalek = "2.1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
semver = "1.0"
hara-abi = { version = "0.1.6", path = "abi" }
wasm-encoder = "0.41.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hara-db-postgres = { version = "0.1.0", git = "https://github.com/hara-lang/hara-extensions.git", rev = "0432324505d721711d1de5aaeae66ee305730456", package = "hara-db-postgres" }
russh = "0.62.7"
russh-sftp = "2.4.0"
tokio = { version = "1.53", features = ["io-util", "net", "rt", "sync", "time"] }
wasmtime = { version = "18.0.0", default-features = false, features = ["cranelift", "runtime"] }
rustyline = "14.0.0"
home = "=0.5.9"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rand = "0.10"

# Experimental bytecode VM benchmark driver (issue #195). The binary remains
# feature-gated so feature-minimal builds exclude it.
[[bin]]
name = "hara-bytecode-benchmark"
path = "src/bin/hara-bytecode-benchmark.rs"
required-features = ["bytecode-vm"]

[[bin]]
name = "hara-foundation-artifact"
path = "src/bin/hara-foundation-artifact.rs"
required-features = ["bytecode-vm"]

[[bin]]
name = "hara-bytecode-conformance-artifact"
path = "src/bin/hara-bytecode-conformance-artifact.rs"
required-features = ["bytecode-vm"]

[[bin]]
name = "hara-bytecode-artifact"
path = "src/bin/hara-bytecode-artifact.rs"
required-features = ["bytecode-vm"]

[[bin]]
name = "hara-code-vm-conformance"
path = "src/bin/hara-code-vm-conformance.rs"
required-features = ["code-vm-conformance"]

[[bin]]
name = "hara-whole-wasm-artifact"
path = "src/bin/hara-whole-wasm-artifact.rs"
required-features = ["whole-wasm"]

[[bin]]
name = "hara-whole-wasm-benchmark"
path = "src/bin/hara-whole-wasm-benchmark.rs"
required-features = ["whole-wasm"]

[[bin]]
name = "hara-code-analyzer"
path = "src/bin/hara-code-analyzer.rs"
required-features = ["whole-wasm"]

[[bin]]
name = "hara-instrumentation-conformance"
path = "src/bin/hara-instrumentation-conformance.rs"

[[bin]]
name = "hara-instrumentation-compare"
path = "src/bin/hara-instrumentation-compare.rs"

[dev-dependencies]
hara-hta = { version = "0.1.6", path = "hta-codec" }
