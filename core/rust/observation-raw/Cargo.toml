[package]
name = "hara-bytecode-observation-raw"
version = "0.1.6"
edition = "2021"
description = "On-demand browser-safe live bytecode observation runtime for Hara"
license = "Apache-2.0"
rust-version = "1.78"
repository = "https://github.com/hara-lang/hara"
homepage = "https://www.hara-lang.org"
publish = false

# Keep this on-demand browser module outside the main runtime workspace. The
# Studio archive builds it as a separate Wasm payload so ordinary evaluation
# pays no observability size or execution cost.
[workspace]

[lib]
name = "hara_bytecode_observation_raw"
crate-type = ["cdylib", "rlib"]

[profile.browser-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[features]
default = ["bytecode-observation", "raw-wasm"]
evaluation-journal = []
dev-trace = ["evaluation-journal"]
halc-encoder = []
hir-encoder = ["halc-encoder"]
bytecode-vm = []
bytecode-instrumentation = ["bytecode-vm"]
bytecode-observation = ["bytecode-vm"]
tracing-jit = ["bytecode-vm"]
raw-wasm = []

[dependencies]
sha2 = "0.10"
hara-runtime = { path = "../runtime", default-features = false, features = ["bytecode-observation"] }

[patch."https://github.com/hara-lang/hara.git"]
hara-abi = { path = "../abi" }
