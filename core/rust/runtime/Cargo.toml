[package]
name = "hara-runtime"
version = "0.1.6"
edition = "2021"
description = "Target-neutral Hara runtime and execution boundary"
license = "Apache-2.0"
rust-version = "1.78"
repository = "https://github.com/hara-lang/hara"
homepage = "https://www.hara-lang.org"
publish = false
build = "build.rs"

[lib]
# The runtime owns the existing source graph at its real filesystem root. This
# is an internal workspace boundary, not a separately published crate: the
# public `hara-wasm` package owns distribution and carries the source graph.
# Keeping this package unpublished avoids creating a second source archive or
# making consumers depend on an implementation crate.
path = "../src/runtime_lib.rs"
crate-type = ["rlib"]
test = false

[features]
default = ["bytecode-vm", "bytecode-instrumentation", "browser-wasm"]
browser-wasm = [
    "getrandom/js",
]
evaluation-journal = []
dev-trace = ["evaluation-journal"]
halc-encoder = []
hir-encoder = ["halc-encoder"]
bytecode-vm = []
bytecode-instrumentation = ["bytecode-vm"]
bytecode-observation = ["bytecode-vm"]
code-vm-conformance = ["bytecode-observation", "halc-encoder", "evaluation-journal"]
raw-wasm = []
tracing-jit = ["bytecode-vm"]
native-jit = ["tracing-jit"]
# Direct native execution is the opt-in VM plus native-substrate boundary.
# Cranelift remains available only through the VM's tracing/basic-loop tier.
direct-native = ["native-jit"]
whole-wasm = ["bytecode-vm"]

[dependencies]
hara-protocol-macros = { path = "../protocol-macros" }
inventory = "0.3"
md5 = "0.8"
uuid = "1.24"
wasm-bindgen = "0.2"
sha2 = "0.10"
hmac = "0.12"
regex = "1.11"
serde_json = "1.0"
ed25519-dalek = "2.1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
semver = "1.0"
hara-abi = { version = "0.1.6", path = "../abi" }
wasm-encoder = "0.41.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
getrandom = { version = "0.2", default-features = false, features = ["custom"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"
hara-db-postgres = { version = "0.1.0", git = "https://github.com/hara-lang/hara-extensions.git", rev = "0432324505d721711d1de5aaeae66ee305730456", package = "hara-db-postgres" }
russh = "0.62.7"
russh-sftp = "2.4.0"
tokio = { version = "1.53", features = ["io-util", "net", "rt", "sync", "time"] }
wasmtime = { version = "18.0.0", default-features = false, features = ["cranelift", "runtime"] }
rustyline = "14.0.0"
home = "=0.5.9"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
rand = "0.10"
