[package]
name = "hara-wasm-raw"
version = "0.1.6"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["raw-wasm"]
raw-wasm = []
evaluation-journal = ["hara-runtime/evaluation-journal"]
dev-trace = ["evaluation-journal"]
halc-encoder = []
hir-encoder = ["halc-encoder"]
bytecode-vm = ["hara-runtime/bytecode-vm"]
tracing-jit = ["bytecode-vm"]
rich-hta = []

[dependencies]
hara-runtime = { path = "../runtime", default-features = false, features = ["raw-wasm"] }
sha2 = "0.10"
hmac = "0.12"
getrandom = { version = "0.2", default-features = false, features = ["custom"] }
ed25519-dalek = "2.1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
regex = "1.11"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
